services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORDON_DATABASE_URL: sqlite:///./backend/data/cordon.db
      CORDON_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_CORDON_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
